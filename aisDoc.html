<!DOCTYPE html>
<html>

  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .square {
        height: 50px;
        width: 50px;
        position: relative;
        left: 200px;
        top: -30px;
        background-color: #655;
      }

      .tug {
        background-color: #FF6347;
      }

      .cargo {
        background-color: #708090;
      }


      .tanker {
        background-color: #8B4513;
      }

      .passenger {
        background-color: #136fd5;
      }

      .highspeed {
        background-color: #ffe55c;
      }

      .sar {
        background-color: #ff1010;
      }

      .fishing {
        background-color: #a0af64;
      }

      .diving {
        background-color: #FF8C00;
      }

      .other {
        background-color: #aa5349;
      }

      .pleasure {
        background-color: #e367f8;
      }

      .sailing {
        background-color: #7FFF00;
      }

      .unk {
        background-color: #FF1493;
      }

      .reserved {
        background-color: #d2d5da;
      }
    </style>
  </head>

  <body>

    <h2>TUG<div class="square tug"></div>
    </h2>
    <h2>CARGO<div class="square cargo"></div>
    </h2>
    <h2>TANKER<div class="square tanker"></div>
    </h2>
    <h2>PASSENGER<div class="square passenger"></div>
    </h2>
    <h2>HIGHSPEED<div class="square highspeed"></div>
    </h2>
    <h2>FISHING<div class="square fishing"></div>
    </h2>
    <h2>DIVING<div class="square diving"></div>
    </h2>
    <h2>PLEASURE<div class="square pleasure"></div>
    </h2>
    <h2>SAILING<div class="square sailing"></div>
    </h2>
    <h2>SAR<div class="square sar"></div>
    </h2>
    <h2>OTHER<div class="square other"></div>
    </h2>
    <h2>Unknown<div class="square unk"></div>
    </h2>
    <h2>Reserved<div class="square reserved"></div>
    </h2>
  </body>

</html>
